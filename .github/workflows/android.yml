name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, unit + ViewModel + Robolectric (screens and shared flows) tests, the overall 80% Kover gate
  # (:domain + :data + :app debug, merged "all" variant) and the debug APK.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, tests, overall coverage gate (>= 80% lines), debug APK
        run: ./gradlew lint test koverVerify koverHtmlReport assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload test, lint and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/tests/
            android/app/build/reports/lint-results-*.html
            android/build/reports/kover/
          if-no-files-found: ignore

  # End-to-end Compose flows on an emulator with Accessibility Test Framework checks, plus the
  # UI-tests-only presentation coverage gate (JaCoCo, >= 80% lines).
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator tests + UI coverage gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest createDebugAndroidTestCoverageReport uiCoverageVerify

      - name: Upload instrumented test and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/reports/jacoco/uiCoverageReport/
          if-no-files-found: ignore
