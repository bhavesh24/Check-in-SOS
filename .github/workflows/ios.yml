name: iOS

on:
  push:
    paths: ["ios/**", "scripts/check_ios_coverage.py", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "scripts/check_ios_coverage.py", ".github/workflows/ios.yml"]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Phase 1: CheckInCore (Domain + Data) only. Phases 2+ add:
      #   brew install xcodegen && (cd ios && xcodegen generate)
      #   unit tests (-skip-testing:CheckInSOSUITests) → build/UnitTests.xcresult
      #   UI tests (-only-testing:CheckInSOSUITests) → build/UITests.xcresult + presentation gate
      #   xcresulttool merge → build/All.xcresult + overall gate
      - name: Test CheckInCore with coverage
        working-directory: ios/Packages/CheckInCore
        run: |
          xcodebuild test \
            -scheme CheckInCore-Package \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath ../../build/CoreTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Overall coverage gate (>= 80% lines)
        run: python3 scripts/check_ios_coverage.py ios/build/CoreTests.xcresult 80

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ios/build/*.xcresult
          if-no-files-found: ignore
